name: Deploy Lessie Backend

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'

  workflow_dispatch:

jobs:

  build-and-deploy:

    runs-on: windows-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Backend/src/Api/Lessie.Api.csproj

    - name: Build
      run: dotnet build Backend/src/Api/Lessie.Api.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish Backend/src/Api/Lessie.Api.csproj `
            --configuration Release `
            --output ./publish `
            --no-build

    - name: Validate secrets
      shell: pwsh
      env:
        USER: ${{ secrets.WEBDEPLOY_USER }}
        PASS: ${{ secrets.WEBDEPLOY_PASSWORD }}
      run: |
        Write-Host "USER length: $($env:USER.Length)"
        Write-Host "PASS length: $($env:PASS.Length)"

    - name: Validate expected username
      shell: pwsh
      env:
        pass: ${{ secrets.WEBDEPLOY_PASSWORD }}
      run: |
        if ($env:pass -ne "WL2015S0lut22") {
          throw "WEBDEPLOY_USER não corresponde ao usuário esperado."
        }

        Write-Host "pass corresponde ao perfil."


    - name: Deploy via WebDeploy
      shell: pwsh
      run: |
        dotnet publish Backend/src/Api/Lessie.Api.csproj `
          --configuration Release `
          --no-build `
          -p:WebPublishMethod=MSDeploy `
          -p:MSDeployServiceURL="https://win8133.site4now.net:8172/msdeploy.axd?site=wlsolutions-002-site10" `
          -p:DeployIisAppPath="wlsolutions-002-site10" `
          -p:MSDeployPublishMethod=WMSVC `
          -p:UserName="${{ secrets.WEBDEPLOY_USER }}" `
          -p:Password="${{ secrets.WEBDEPLOY_PASSWORD }}" `
          -p:AllowUntrustedCertificate=True
